[package]
name = "canvas"
description = "Omina Edit (Canvas, in the code): pictures and vector art in one app, beside Omina Motion and Omina Develop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The channel that hands files the system asks to open over to the window.
futures = "0.3"
canvas-core.workspace = true
canvas-render.workspace = true
iris.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
# The same image library GPUI uses, for handing it rendered pictures.
image.workspace = true
# Remove Background: Studio's cutout (the MobileSAM model, run on this Mac with Candle), shared
# with Studio rather than copied. It lives in the "Omina Motion" project beside this one.
studio-cutout = { path = "../../../Omina Motion/crates/studio-cutout" }

# Packaging into Canvas.app with cargo-packager (see Studio's release script for the same setup).
[package.metadata.packager]
product-name = "Omina Edit"
identifier = "com.oddomens.canvas"
publisher = "Odd Omens LLC"
category = "Graphics and Design"
description = "Photo editing, painting and vector design in one app: Photoshop-style layers and retouching, Lightroom-style develop settings and Illustrator-style shapes."
copyright = "Copyright © 2026 Odd Omens LLC. Free software under the GNU GPL, version 3 or later."
license-file = "../../LICENSE"
icons = ["../../assets/icon/canvas-512@2x.png", "../../assets/icon/canvas-512.png", "../../assets/icon/canvas-256@2x.png", "../../assets/icon/canvas-256.png", "../../assets/icon/canvas-128@2x.png", "../../assets/icon/canvas-128.png", "../../assets/icon/canvas-32@2x.png", "../../assets/icon/canvas-32.png", "../../assets/icon/canvas-16@2x.png", "../../assets/icon/canvas-16.png"]
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "canvas", main = true }]
resources = ["../../LICENSE", "../../assets/icon/omie-document.icns"]

# Double-clicking a project opens it in Omina Edit. Windows and Linux installers register this;
# on macOS, Info.plist declares the file type in full (it replaces what this would write).
# Projects are .omie (".canvas", the older extension, is also Obsidian's, so it isn't claimed here).
[[package.metadata.packager.file-associations]]
extensions = ["omie"]
name = "Omina Edit Project"
description = "Omina Edit Project"
mime-type = "application/x-omina-edit"
role = "editor"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
# Extra Info.plist keys: the project file type this app opens.
info-plist-path = "Info.plist"

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
