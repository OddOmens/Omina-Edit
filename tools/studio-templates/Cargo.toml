# Turns Studio's animated templates into still Canvas sample projects. Run it from anywhere
# when Studio's templates change:
#
#   cargo run --release --manifest-path tools/studio-templates/Cargo.toml
#
# It reads Studio's code from the "Omina Motion" folder beside this project, and writes
# `crates/canvas-core/templates/motion.zip` and `crates/canvas-core/src/motion_templates.rs`.
# Add `-- --preview <folder>` to also save each design beside Studio's own picture of it.
[package]
name = "studio-templates"
version = "0.1.0"
edition = "2024"
publish = false

# A workspace of its own: it isn't part of Canvas's build, which never depends on Studio.
[workspace]

[dependencies]
studio-core = { path = "../../../Omina Motion/crates/studio-core" }
studio-render = { path = "../../../Omina Motion/crates/studio-render" }
canvas-core = { path = "../../crates/canvas-core" }
canvas-render = { path = "../../crates/canvas-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=1.3.1", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
